<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bsShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#131b29"/>
      <stop offset="100%" stop-color="#0b2436"/>
    </linearGradient>
    <linearGradient id="bsRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bsVector" x1="0%" y1="80%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bsSweep" x1="32" y1="32" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="bsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Hexagonal Quant Shield -->
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="url(#bsShieldBg)" stroke="url(#bsRim)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Radar Sweep Sector -->
  <path d="M32 32 L32 13 A19 19 0 0 1 49.5 24 Z" fill="url(#bsSweep)"/>
  <!-- Concentric Scout Reticle Rings & Crosshair Ticks -->
  <circle cx="32" cy="32" r="19" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="11" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.1"/>
  <line x1="32" y1="8.5" x2="32" y2="13.5" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="50.5" x2="32" y2="55.5" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8.5" y1="32" x2="13.5" y2="32" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50.5" y1="32" x2="55.5" y2="32" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Rising Scout Edge Vector & Locked Target Node -->
  <path d="M16 44 L27 33 L33 38 L46 18" stroke="url(#bsVector)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#bsGlow)"/>
  <path d="M39.5 17.5 L46.5 17.5 L46.5 24.5" stroke="#22c55e" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27" cy="33" r="2.5" fill="#38bdf8"/>
  <circle cx="46" cy="18" r="5.6" stroke="#22c55e" stroke-opacity="0.48" stroke-width="1.3"/>
  <circle cx="46" cy="18" r="2.8" fill="#22c55e"/>
</svg>
