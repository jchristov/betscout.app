[project]
name = "betscout"
version = "0.2.0"
description = "BetScout (betscout.app) — Out-of-Sample Multi-Sport Quantitative Edge, Exact-Score & Paper-Betting Intelligence"
authors = [
    { name = "Yuliyan Hristov", email = "yuliyan.hristov@rbinternational.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
betscout = "sportdata_model:webapp_cli"
betscout-model = "sportdata_model:main"
betscout-ingest = "sportdata_model:ingest_cli"
betscout-quality = "sportdata_model:quality_cli"
betscout-edges = "sportdata_model:quant_edges_cli"
betscout-bet = "sportdata_model:paper_bet_cli"
betscout-dashboard = "sportdata_model:dashboard_cli"
betscout-ledger = "sportdata_model:ledger_cli"
betscout-webapp = "sportdata_model:webapp_cli"
betscout-discord = "sportdata_model:discord_cli"
betscout-telegram = "sportdata_model:telegram_cli"
betscout-exact-score = "sportdata_model:exact_score_cli"
betscout-calibrate = "sportdata_model:calibrate_cli"
sportdata-model = "sportdata_model:main"
sportdata-ingest = "sportdata_model:ingest_cli"
sportdata-quality = "sportdata_model:quality_cli"
sportdata-enrich = "sportdata_model:enrich_cli"
sportdata-edges = "sportdata_model:quant_edges_cli"
sportdata-bet = "sportdata_model:paper_bet_cli"
sportdata-dashboard = "sportdata_model:dashboard_cli"
sportdata-ledger = "sportdata_model:ledger_cli"
sportdata-webapp = "sportdata_model:webapp_cli"
sportdata-discord = "sportdata_model:discord_cli"
sportdata-telegram = "sportdata_model:telegram_cli"
sportdata-distill = "sportdata_model:distill_cli"
sportdata-compare = "sportdata_model:compare_models_cli"
sportdata-exact-score = "sportdata_model:exact_score_cli"
sportdata-calibrate = "sportdata_model:calibrate_cli"
vektorpulse = "sportdata_model:webapp_cli"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sportdata_model"
