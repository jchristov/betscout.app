[project]
name = "betscout"
version = "0.4.0"
description = "BetScout (betscout.app) — Out-of-Sample Multi-Sport Quantitative Edge, Exact-Score & Paper-Betting Intelligence"
authors = [
    { name = "Yuliyan Hristov", email = "yuliyan.hristov@rbinternational.com" }
]
requires-python = ">=3.12"
dependencies = [
    "betscout-sdk",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
betscout-sdk = { path = "../sdk/python", editable = true }

[project.scripts]
betscout = "betscout:cli"
betscout-mcp = "betscout.mcp_stdio:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
