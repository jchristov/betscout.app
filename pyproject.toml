[project]
name = "betscout"
version = "0.2.0"
description = "BetScout (betscout.app) — Out-of-Sample Multi-Sport Quantitative Edge, Exact-Score & Paper-Betting Intelligence"
authors = [
    { name = "Yuliyan Hristov", email = "yuliyan.hristov@rbinternational.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
betscout = "betscout:webapp_cli"
betscout-webapp = "betscout:webapp_cli"
betscout-model = "betscout:main"
betscout-ingest = "betscout:ingest_cli"
betscout-quality = "betscout:quality_cli"
betscout-enrich = "betscout:enrich_cli"
betscout-edges = "betscout:quant_edges_cli"
betscout-bet = "betscout:paper_bet_cli"
betscout-dashboard = "betscout:dashboard_cli"
betscout-ledger = "betscout:ledger_cli"
betscout-discord = "betscout:discord_cli"
betscout-telegram = "betscout:telegram_cli"
betscout-distill = "betscout:distill_cli"
betscout-compare = "betscout:compare_models_cli"
betscout-exact-score = "betscout:exact_score_cli"
betscout-calibrate = "betscout:calibrate_cli"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
